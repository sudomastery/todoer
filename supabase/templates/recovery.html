<table width="100%" cellpadding="0" cellspacing="0" style="background:#f7f7f5;padding:32px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <tr>
    <td align="center">
      <table width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:14px;overflow:hidden;border:1px solid #eceae6">
        <tr>
          <td style="background:#dc4c3e;padding:22px 28px">
            <span style="color:#ffffff;font-size:20px;font-weight:700;letter-spacing:-0.3px">Todoer</span>
          </td>
        </tr>
        <tr>
          <td style="padding:30px 28px 8px">
            <h1 style="margin:0 0 12px;font-size:20px;color:#202020">Reset your password</h1>
            <p style="margin:0 0 22px;font-size:15px;line-height:23px;color:#555555">
              Choose a new password for your Todoer account. This link expires in one hour.
            </p>
            <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#dc4c3e;color:#ffffff;text-decoration:none;font-size:15px;font-weight:600;padding:12px 26px;border-radius:8px">
              Set a new password
            </a>
          </td>
        </tr>
        <tr>
          <td style="padding:22px 28px 30px">
            <p style="margin:0;font-size:12px;line-height:19px;color:#8a8a8a">
              If the button does not work, paste this into your browser:<br />
              <span style="color:#dc4c3e;word-break:break-all">{{ .ConfirmationURL }}</span>
            </p>
            <p style="margin:16px 0 0;font-size:12px;line-height:19px;color:#8a8a8a">
              Did not ask for this? Ignore this email; your password stays as it is.
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
